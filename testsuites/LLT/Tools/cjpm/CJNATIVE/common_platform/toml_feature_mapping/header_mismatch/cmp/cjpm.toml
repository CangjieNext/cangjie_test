[package]
  cjc-version = "1.0.0"
  compile-option = ""
  description = "nothing here"
  link-option = ""
  name = "cmp"
  output-type = "dynamic"
  override-compile-option = ""
  target-dir = ""
  version = "1.0.0"
  package-configuration = {}

[dependencies]

[profile]
  experimental = true

[[feature]]
  names = [ "user.cmp.userfeat", "user.cmp.extra" ]

[[feature]]
  name = "user.cmp.plat"
  mapping = [ "user.cmp.userfeat", "user.cmp.extra" ]

[[source-set]]
  src-dir = "./common"
  features = [ ]

[[source-set]]
  src-dir = "./extra"
  features = [ "user.cmp.extra" ]

[[source-set]]
  src-dir = "./platform"
  features = [ "user.cmp.userfeat", "user.cmp.plat" ]
