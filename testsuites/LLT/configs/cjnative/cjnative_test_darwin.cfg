[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
inherit=./cjnative_test.cfg
[condition]
condition =
  CJNATIVE
  x86
  Darwin
  Unix
[internal-var]
  compiler = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/%%run_env && cjc --set-runtime-rpath
  dylib_suffix = dylib
  run = %%run_macro
  run_pkg = %%run_macro
  run_macro = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/%%run_env:$DYLD_LIBRARY_PATH &&
  run_stdx = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_STDX_PATH:$DYLD_LIBRARY_PATH &&
  run_env = darwin_x86_64_cjnative
  sed_opt = -i ""
  clang_opt = -shared -fPIC -Wl,-undefined,suppress,-flat_namespace
  clang_shared_opt = -shared -fPIC -Wl,-undefined,suppress,-flat_namespace
  serial_compile =
  core_cmp_opt = %%cmp_opt_chir2hlir
  frontendCompiler = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/%%run_env && cjc-frontend
  clang = clang

  # cross-compile
  target = --target
  toolchain = --toolchain
  sysroot = --sysroot
  host_arch = x86_64
  host_os = apple
  host_env = darwin

  # std/libs/unittest
  cmp_utest_opt = --test
  run_utest_opt = %%utest_no_progress
  utest_no_progress = --no-progress

  enableEH = --experimental --enable-eh %%import-cangjie-stdx

  # native FFI
  ## objc
  cangjie_runtime_link = -L$CANGJIE_HOME/runtime/lib/%%run_env -rpath $CANGJIE_HOME/runtime/lib/%%run_env

  cffi_std_link = -lc++

  stdx-package = -L $CANGJIE_HOME/lib/darwin_x86_64_cjnative/
  import-cangjie-stdx = -L $CANGJIE_STDX_PATH -laspectCJ@cangjie_stdx -lchir@cangjie_stdx -lunittest.data@cangjie_stdx -lunittest@cangjie_stdx -lencoding.json@cangjie_stdx -lserialization.serialization@cangjie_stdx -lserialization@cangjie_stdx  -lnet.http@cangjie_stdx -lnet.tls@cangjie_stdx -lnet.tls.common@cangjie_stdx -lnet@cangjie_stdx -llogger@cangjie_stdx -llog@cangjie_stdx -lencoding.url@cangjie_stdx -lencoding.json.stream@cangjie_stdx -lcrypto.kit@cangjie_stdx -lcrypto.x509@cangjie_stdx -lcrypto.keys@cangjie_stdx -lcrypto.crypto@cangjie_stdx -lcrypto.digest@cangjie_stdx -lcrypto.common@cangjie_stdx -lcrypto@cangjie_stdx -lencoding.hex@cangjie_stdx -lencoding.base64@cangjie_stdx -lencoding@cangjie_stdx -lcompress.tar@cangjie_stdx -lcompress.zlib@cangjie_stdx -lcompress@cangjie_stdx -lactors@cangjie_stdx -leffect@cangjie_stdx -lstring_intern@cangjie_stdx %%cangjie-stdx-import-path
  import-stdx-fuzz = -L $CANGJIE_STDX_PATH  -lfuzz.fuzz@cangjie_stdx  %%cangjie-stdx-import-path
  set_stdx_path = LD_LIBRARY_PATH=$CANGJIE_STDX_PATH:$LD_LIBRARY_PATH
  cangjie-stdx-import-path = --import-path  $CANGJIE_STDX_PATH
  cffi_output = lib%%n.dylib
  cffi_runtime_link = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/darwin_x86_64_cjnative/ -rpath $CANGJIE_HOME/runtime/lib/darwin_x86_64_cjnative/ -lcangjie-runtime --rtlib=compiler-rt -lstdc++ -fno-omit-frame-pointer
  pwd_to_ld_path = DYLD_LIBRARY_PATH=$(pwd):$DYLD_LIBRARY_PATH
  stdc++_opt = -std=c++11

  ldd = otool -L
[description]
  title = cangjie_cjnative_test_darwin
[env]
  LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
