[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
inherit=./cjnative_test_darwin.cfg
[condition]
condition =
  CJNATIVE
  aarch64
  Darwin
  Unix
[internal-var]
  run_env = darwin_aarch64_cjnative

  # cross-compile
  target = --target
  toolchain = --toolchain
  sysroot = --sysroot
  host_arch = aarch64
  host_os = apple
  host_env = darwin

  # std/libs/unittest
  cmp_utest_opt = --test
  run_utest_opt = %%utest_no_progress
  utest_no_progress = --no-progress

  enableEH = --experimental --enable-eh %%import-cangjie-stdx


  cffi_std_link = -lc++

  stdx-package = -L $CANGJIE_HOME/lib/darwin_aarch64_cjnative/

  import-cangjie-stdx = -L $CANGJIE_STDX_PATH -l:libaspectCJ@cangjie_stdx.dylib -l:libchir@cangjie_stdx.dylib -l:libunittest.data@cangjie_stdx.dylib -l:libunittest@cangjie_stdx.dylib -l:libencoding.json@cangjie_stdx.dylib -l:libserialization.serialization@cangjie_stdx.dylib -l:libserialization@cangjie_stdx.dylib  -l:libnet.http@cangjie_stdx.dylib -l:libnet.tls@cangjie_stdx.dylib -l:libnet.tls.common@cangjie_stdx.dylib -l:libnet@cangjie_stdx.dylib -l:liblogger@cangjie_stdx.dylib -l:liblog@cangjie_stdx.dylib -l:libencoding.url@cangjie_stdx.dylib -l:libencoding.json.stream@cangjie_stdx.dylib -l:libcrypto.kit@cangjie_stdx.dylib -l:libcrypto.x509@cangjie_stdx.dylib -l:libcrypto.keys@cangjie_stdx.dylib -l:libcrypto.crypto@cangjie_stdx.dylib -l:libcrypto.digest@cangjie_stdx.dylib -l:libcrypto.common@cangjie_stdx.dylib -l:libcrypto@cangjie_stdx.dylib -l:libencoding.hex@cangjie_stdx.dylib -l:libencoding.base64@cangjie_stdx.dylib -l:libencoding@cangjie_stdx.dylib -l:libcompress.tar@cangjie_stdx.dylib -l:libcompress.zlib@cangjie_stdx.dylib -l:libcompress@cangjie_stdx.dylib -l:libactors@cangjie_stdx.dylib -l:libeffect@cangjie_stdx.dylib -l:libstring_intern@cangjie_stdx.dylib %%cangjie-stdx-import-path
  import-stdx-fuzz = -L $CANGJIE_STDX_PATH  -l:libfuzz.fuzz@cangjie_stdx.dylib  %%cangjie-stdx-import-path
  set_stdx_path = LD_LIBRARY_PATH=$CANGJIE_STDX_PATH:$LD_LIBRARY_PATH
  cangjie-stdx-import-path = --import-path  $CANGJIE_STDX_PATH

  cffi_output = lib%%n.dylib
  cffi_runtime_link = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative/ -rpath $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative/ -lcangjie-runtime --rtlib=compiler-rt -lc++ -fno-omit-frame-pointer
  pwd_to_ld_path = DYLD_LIBRARY_PATH=$(pwd):$DYLD_LIBRARY_PATH
  stdc++_opt = -std=c++11

  ldd = otool -L
[description]
  title = cangjie_cjnative_test_darwin_aarch64
[env]
  LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
