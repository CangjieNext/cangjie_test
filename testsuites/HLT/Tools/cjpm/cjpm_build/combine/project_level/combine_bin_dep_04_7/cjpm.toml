[dependencies]
dep1 = {path = "dep1"}

[ffi.c.test01]
  path = "./"

[ffi.c.test02]
  path = "./"

[package]
  cjc-version = "1.0.0"
  compile-option = ""
  description = "nothing here"
  link-option = ""
  name = "b"
  output-type = "executable"
  override-compile-option = ""
  version = "1.0.0"

[profile.build]
lto = "full"
[profile.build.combined]
 b = "dynamic"
[package.package-configuration.b]
combine-all-deps = true
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["dep/target/release/dep"]


[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["dep/target/release/dep"]

 
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["dep/target/release/dep"]
 
 

 
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["dep/target/aarch64-linux-ohos/release/dep"]

[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["dep/target/x86_64-linux-ohos/release/dep"]

[target.aarch64-linux-android26.bin-dependencies]
  path-option = ["dep/target/aarch64-linux-android26/release/dep"]

[target.aarch64-linux-android31.bin-dependencies]
  path-option = ["dep/target/aarch64-linux-android31/release/dep"]

[target.aarch64-linux-android32.bin-dependencies]
  path-option = ["dep/target/aarch64-linux-android32/release/dep"]

[target.aarch64-linux-android35.bin-dependencies]
  path-option = ["dep/target/aarch64-linux-android35/release/dep"]

[target.x86_64-linux-ohos]
  compile-option = "-B=${OHOS_ROOT}/llvm/prebuilt/x86_64-linux-ohos/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/x86_64-linux-ohos/sysroot"

[target.aarch64-linux-ohos]
  compile-option = "-B${OHOS_ROOT}/out/generic_generic_arm_64only/hisi_all_phone_standard/obj/third_party/musl/usr/lib/aarch64-linux-ohos -B${OHOS_ROOT}/prebuilts/clang/ohos/windows-x86_64/llvm/bin -L${OHOS_ROOT}/prebuilts/clang/ohos/windows-x86_64/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos -L${OHOS_ROOT}/prebuilts/clang/ohos/windows-x86_64/llvm/lib/aarch64-linux-ohos -L${OHOS_ROOT}/out/generic_generic_arm_64only/hisi_all_phone_standard/obj/third_party/musl/usr/lib/aarch64-linux-ohos -L${OHOS_ROOT}/out/generic_generic_arm_64only/hisi_all_phone_standard/thirdparty/openssl"
	

[target.aarch64-linux-android26]
  compile-option = "-B=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/sysroot"
[target.aarch64-linux-android31]
  compile-option = "-B=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/sysroot"
[target.aarch64-linux-android32]
  compile-option = "-B=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/sysroot"
[target.aarch64-linux-android35]
  compile-option = "-B=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/sysroot"