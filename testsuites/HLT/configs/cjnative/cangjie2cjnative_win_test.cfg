[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
  inherit=./common_windows.cfg
[env]
  LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
[condition]
  condition = host_win host_x86_64 target_win target_x86_64 CJNATIVE x86 Windows
[internal-var]
  # cjc
  suffix = exe
  test_suffix = dll
  null_path=NUL
  serial_compile =

  # run
  export = set
  source = sh
  run = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% &&
  run_pkg = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% &&
  run_macro = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% &&
  run_stdx = set PATH=%%CANGJIE_STDX_PATH%%;%%PATH%% &&

  # API
  stdx-package = -L %%CANGJIE_HOME%%/lib/linux_x86_64_cjnative/
  cangjie-stdx-package = %%CANGJIE_STDX_PATH%%
  stdx-library-path = -L %%CANGJIE_STDX_PATH%% %%cangjie-stdx-import-path
  import-cangjie-stdx = -L %%CANGJIE_STDX_PATH%% -lchir@cangjie_stdx -lunittest.data@cangjie_stdx -lunittest@cangjie_stdx -lencoding.json@cangjie_stdx -lserialization.serialization@cangjie_stdx -lserialization@cangjie_stdx -lnet.http@cangjie_stdx -lnet.tls@cangjie_stdx -lnet.tls.common@cangjie_stdx -lnet@cangjie_stdx -llogger@cangjie_stdx -llog@cangjie_stdx -lencoding.url@cangjie_stdx -lencoding.json.stream@cangjie_stdx -lcrypto.kit@cangjie_stdx -lcrypto.x509@cangjie_stdx -lcrypto.crypto@cangjie_stdx -lcrypto.keys@cangjie_stdx -lcrypto.digest@cangjie_stdx -lcrypto.common@cangjie_stdx -lencoding.hex@cangjie_stdx -lencoding.base64@cangjie_stdx -lencoding@cangjie_stdx -lcrypt32 -lcrypto@cangjie_stdx -lcompress.zlib@cangjie_stdx -lcompress@cangjie_stdx -lcompress.tar@cangjie_stdx -lactors@cangjie_stdx -lsyntax@cangjie_stdx %%cangjie-stdx-import-path --dy-std
  set_stdx_path = set PATH= %%CANGJIE_STDX_PATH%%;%%PATH%% &&
  import-stdx-fuzz = -L %%CANGJIE_STDX_PATH%% -lfuzz.fuzzFFI -lfuzz.fuzz@cangjie_stdx  %%cangjie-stdx-import-path
  cangjie-stdx-import-path = --import-path %%CANGJIE_STDX_PATH%%

  # c ffi
  cffi_output = lib%%n.dll --target=x86_64-windows-gnu
  cffi_runtime_link = -D__DSU__ -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/%%run_env/ -lcangjie-runtime -Wl,-whole-archive  -Wl,-no-whole-archive -lstdc++ -fno-omit-frame-pointer
  cffi_runtime_link_no_elfloader = -D__DSU__ -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/%%run_env/ -lcangjie-runtime  -Wl,-whole-archive  -Wl,-no-whole-archive -lstdc++ -fno-omit-frame-pointer

  # Tools
  set = set
  plugin_lsp_suffix = dll.a

  # hle
  hle_c = %%CANGJIE_HOME%%/tools/bin/hle -c -b %%CANGJIE_HOME%%/tools/dtsparser/node_modules/.bin/cjbind.exe
  hle_arkts = %%CANGJIE_HOME%%/tools/bin/hle -r %%CANGJIE_HOME%%/tools/dtsparser/node_modules/typescript -j %%CANGJIE_HOME%%/tools/dtsparser/analysis.js

  # cjcpl
  cjcpl = %%CANGJIE_HOME%%/tools/bin/cjcpl

  # cjfmt
  cjfmt = %%CANGJIE_HOME%%/tools/bin/cjfmt

  # cjlint
  lint = %%CANGJIE_HOME%%/tools/bin/cjlint
  cangjieDir = %%CANGJIE_HOME%%
  cangjieStdxPath = %%CANGJIE_STDX_PATH%%

  # cjcov
  cjcov = %%CANGJIE_HOME%%/tools/bin/cjcov

  # cjtrace-recover
  cjtrace_recover = %%CANGJIE_HOME%%/tools/bin/cjtrace-recover

  # clang
  clang = clang --target=x86_64-windows-gnu
  clang_opt = -shared

  # common
  ls = dir
  copycharjs = dir
  libdir = %%CANGJIE_HOME%%/modules/%%run_env/
  run_env = windows_x86_64_cjnative
  cat = type
  mv = move
  rm = del
  cp = copy
  touch = type nul >
  grep = findstr
  sed = sed
  chmod = %%chmod%%
  pwd =%%cd%%
  mkdir = md

  # cjpm git
  git_dir_prefix = set GIT_DIR=
  git_dir_suffix = &&
  object_file_suffix = obj

  # Obfuscation
  disassembler = set LD_LIBRARY_PATH=%%CANGJIE_HOME%%/third_party/llvm/lib:%%LD_LIBRARY_PATH%% && %%CANGJIE_HOME%%/third_party/llvm/bin/llvm-dis
  dylib_suffix = dll

[description]
  title = Cangjie2cjnative WIN Test
