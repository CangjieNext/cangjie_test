[root]
	path = ../../
[suffix]
	cj = //
	info = //
[run]
[env]
	LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
[condition]
	condition = host_mac, host_aarch64, target_mac, target_aarch64, CJNATIVE, arm, MAC, O2
[internal-var]
	cangjie_test = $CANGJIE_TEST
	compiler = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib && cjc --set-runtime-rpath
	compiler_frontend = cjc-frontend
	cmp_opt = -O2 --error-count-limit=all --diagnostic-format=json
	cmp_opt_frontend = -O2 --error-count-limit=all --diagnostic-format=json
	output = %%n.%%suffix
	suffix = out
	test_suffix = %%dylib_suffix
	middle = a
	null_path = /dev/null
	serial_compile = 
	close_apc_compile = --apc=1
	hle_c = export DYLD_LIBRARY_PATH=$CANGJIE_HOME/runtime/lib/%%host && $CANGJIE_HOME/tools/bin/hle -c -b $CANGJIE_HOME/tools/dtsparser/node_modules/.bin/cjbind
	hle_arkts = export DYLD_LIBRARY_PATH=$CANGJIE_HOME/runtime/lib/%%host && $CANGJIE_HOME/tools/bin/hle -r $CANGJIE_HOME/tools/dtsparser/node_modules/typescript -j $CANGJIE_HOME/tools/dtsparser/analysis.js
	cjcpl = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib && $CANGJIE_HOME/tools/bin/cjcpl
	old_cjo = --old
	new_cjo = --new
	cjfmt = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib && $CANGJIE_HOME/tools/bin/cjfmt
	cjlint = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib && $CANGJIE_HOME/tools/bin/cjlint
	cangjieDir = $CANGJIE_HOME
	cangjie-home = $CANGJIE_HOME
	cangjieStdxPath = $CANGJIE_STDX_PATH
	cjcov = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib && $CANGJIE_HOME/tools/bin/cjcov
	cjtrace_recover = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib && $CANGJIE_HOME/tools/bin/cjtrace-recover
	export = export
	source = source
	run = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib &&
	run_pkg = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib &&
	run_macro = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib &&
	run_stdx = export LD_LIBRARY_PATH=$(pwd):/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libffi/lib/:$CANGJIE_STDX_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/tools/lib:$DYLD_LIBRARY_PATH &&
	run_opt = 
	run_args = 
	run_args_arg = 
	static_std = --static-std
	dy_std = --dy-std
	static_libs = --static-libs
	dy_libs = --dy-libs
	ldd = ldd
	main = main
	mod_opt = --module
	mod_name = --module-name module_name
	pkg_opt = --package
	compile_lib_opt = --output-type=staticlib
	compile_dylib_opt = --output-type=dylib
	compile_chir_opt = --output-type=chir --experimental
	compile_dylib_opt_cjmp = mp.chir --common-part-cjo=mp.cjo --output-type=dylib --experimental
	compile_lib_opt_cjmp = mp.chir --common-part-cjo=mp.cjo --output-type=staticlib --experimental
	link_cjmp = -L . -lmp
	cmp_stable_abi_dylib = -L. -lstable_abi
	enableConstPropagation = --fchir-constant-propagation
	incremental_compile = --incremental-compile --experimental
	overflow_wrapping = --int-overflow=wrapping
	conditional_compilation_config_opt = --cfg
	link_core = link-core = -lcangjie-std-core
	link_collection = 
	link_eh = -lstdx.effect --experimental --enable-eh
	stdx-package = -L $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative
	cangjie-stdx-package = $CANGJIE_STDX_PATH
	stdx-library-path = -L $CANGJIE_STDX_PATH %%cangjie-stdx-import-path
	import-cangjie-stdx = -L $CANGJIE_STDX_PATH -lstdx.chir -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.tar -lstdx.crypto -lstdx.compress.zlib -lstdx.compress -lstdx.actors -lstdx.syntax %%cangjie-stdx-import-path -lc++ --dy-std
	import-stdx-fuzz = -L $CANGJIE_STDX_PATH -lstdx.fuzz.fuzzFFI -lstdx.fuzz.fuzz  %%cangjie-stdx-import-path
	cangjie-stdx-import-path = --import-path $CANGJIE_STDX_PATH
	cffi_output = lib%%n.%%cffi_suffix
	ffic_opt = -L . -l %%n %%n.cj
	pkg_compile = --output-type=dylib -L . -l c_ffi
	pkg_link = -L . -l c_ffi -l pkg
	cffi_runtime_opt = 
	cffi_runtime_link = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer -lboundscheck
	cffi_runtime_link_no_elfloader = -D__DSU__ -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer
	cffi_runtime_ld = --output-type=dylib -L . -l ffi%%n
	cffi_std_link = -lstdc++
	sanitizer_hwasan = --sanitize=hwaddress
	boundscheck = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative/ -lboundscheck
	cffi_suffix = %%dylib_suffix
	set = 
	plugin_lsp_suffix = dylib
	chir_dis = chir-dis
	clang = clang
	clang_opt = -shared -fPIC -Wl,-undefined,suppress,-flat_namespace
	ls = ls
	libdir = $CANGJIE_HOME/modules/darwin_aarch64_cjnative/
	run_env = darwin_aarch64_cjnative
	cat = cat
	mv = mv
	rm = rm
	cp = cp
	touch = touch
	diff = diff
	grep = grep
	sed = sed
	sed_opt = -i ""
	chmod = chmod
	pwd = $(pwd)
	mkdir = mkdir
	rmdir = rm -rf
	use_ast = 
	use_pic_ast = 
	pic_opt = 
	macro_lib_opt = 
	append_opt = 
	append_pic_opt = 
	append_macro_lib_opt = 
	macro_debug = --debug-macro
	enable_macro = 
	cmp_macro = -O2 --error-count-limit=all --diagnostic-format=json --compile-macro
	macro_lib = 
	macro_opt = --output-type=dylib
	run_macro_opt = 
	cjpm_opt = 
	cjpm = export DYLD_LIBRARY_PATH=/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libffi/lib/:$DYLD_LIBRARY_PATH && cjpm
	cpm_bin_path = ./build/bin
	python = python3
	dump = -frontend --dump-parse
	closebuf = stdbuf -o0 -e0
	export_expand = export PATH=$(pwd):$PATH
	object_file_suffix = o
	git_dir_prefix = export DYLD_LIBRARY_PATH=/opt/homebrew/opt/openssl@3/lib:/opt/homebrew/opt/libffi/lib/:$DYLD_LIBRARY_PATH GIT_DIR=
	git_dir_suffix = 
	obf_string = --fobf-string
	no_obf_string = --fno-obf-string
	obf_const = --fobf-const
	no_obf_const = --fno-obf-const
	obf_layout = --fobf-layout
	no_obf_layout = --fno-obf-layout
	obf_cf_flatten = --fobf-cf-flatten
	no_obf_cf_flatten = --fno-obf-cf-flatten
	obf_cf_bogus = --fobf-cf-bogus
	no_obf_cf_bogus = --fno-obf-cf-bogus
	obf_export = --fobf-export-symbols
	no_obf_export = --fno-obf-export-symbols
	obf_sym_input = --obf-sym-input-mapping
	obf_sym_output = --obf-sym-output-mapping
	obf_apply_mapping = --obf-apply-mapping-file
	obf_sym_prefix = --obf-sym-prefix
	obf_source_path = --fobf-source-path
	no_obf_source_path = --fno-obf-source-path
	obf_line_number = --fobf-line-number
	no_obf_line_number = --fno-obf-line-number
	obf_all = --fobf-all
	save_temps = --save-temps=.
	disassembler = LD_LIBRARY_PATH=$CANGJIE_HOME/third_party/llvm/lib:$LD_LIBRARY_PATH $CANGJIE_HOME/third_party/llvm/bin/llvm-dis
	cmp_output = 
	dylib_suffix = dylib
	cmp_utest_opt = --test
	run_utest_opt = %%utest_no_progress
	utest_no_progress = --no-progress
	java = java
	javac = javac -encoding UTF-8
	java_mirror_gen = -Dpackage.mode=true -jar $CANGJIE_HOME/tools/bin/java-mirror-gen.jar -d . -cp .
	java_interop_template = $CANGJIE_TEST/testsuites/HLT/configs/cjnative/android/MyApplication
	java_interop_util = $CANGJIE_TEST/testsuites/HLT/compiler/cjnative/FFI/jffi/android/util
	java_interop_runner = $CANGJIE_TEST/testsuites/HLT/configs/cjnative/android/run.py
	java_interop_setup = $CANGJIE_TEST/testsuites/HLT/configs/cjnative/android/setup.py
	cp_loader_jar = -cp .:$CANGJIE_HOME/lib/library-loader.jar
	jffi_link = -L . -linteroplib.interop -lcinteroplib -ljava.lang
	cangjie-repo-token = $CANGJIE_REPO_TOKEN
	repo_sed = sed -i ''
	host_dylib_suffix = dylib
	cangjie-stdx-path = $CANGJIE_STDX_PATH/../..
	cangjie-static-stdx-path = $CANGJIE_STDX_PATH/../../static/stdx
	cangjie-dynamic-stdx-path = $CANGJIE_STDX_PATH/../../dynamic/stdx
	check-dylib-dep = otool -L
	static-openssl-dir = $STATIC_OPENSSL_DIR
	cangjie_runtime_link = -I$CANGJIE_HOME/include -L$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative -rpath $CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
	link_oc = -linteroplib.objc -lobjc.lang --link-options "-framework Foundation"
	host = darwin_aarch64_cjnative
	target = darwin_aarch64_cjnative
	ohos_opt = 
	ohos_opt_pc = 
	clang_opt_objc = -fmodules -fobjc-arc -I$CANGJIE_HOME/include -L$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
	cmp_ocffi_opt = --error-count-limit 3 -Woff all
	mirror_gen = ObjCInteropGen --mode=normal
	ins_nm_cjworld = --link-options="-install_name @rpath/libcjworld.dylib"
	mirror_opt = --generate-definitions
	enable_objc_cjmapping = --experimental --enable-interop-cjmapping=ObjC
	interop_config = --experimental --import-interop-cj-package-config-path
[description]
	title = Cangjie2cjnative MAC AARCH64 Test
