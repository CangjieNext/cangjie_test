[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
  inherit=./common_mac.cfg
[condition]
  condition = host_mac host_aarch64 target_mac target_aarch64 CJNATIVE arm MAC
[internal-var]
  cmp_ocffi_opt = --error-count-limit 3 -Woff all
  link_oc = -linteroplib.objc
  clang_opt_objc = -fmodules -fobjc-arc -I${CANGJIE_HOME}/include -L${CANGJIE_HOME}/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
  import-cangjie-stdx = -L $CANGJIE_STDX_PATH -l:libchir@cangjie_stdx.dylib -l:libunittest.data@cangjie_stdx.dylib -l:libunittest@cangjie_stdx.dylib -l:libencoding.json@cangjie_stdx.dylib -l:libserialization.serialization@cangjie_stdx.dylib -l:libserialization@cangjie_stdx.dylib -l:libnet.http@cangjie_stdx.dylib -l:libnet.tls@cangjie_stdx.dylib -l:libnet.tls.common@cangjie_stdx.dylib -l:libnet@cangjie_stdx.dylib -l:liblogger@cangjie_stdx.dylib -l:liblog@cangjie_stdx.dylib -l:libencoding.url@cangjie_stdx.dylib -l:libencoding.json.stream@cangjie_stdx.dylib -l:libcrypto.kit@cangjie_stdx.dylib -l:libcrypto.x509@cangjie_stdx.dylib -l:libcrypto.crypto@cangjie_stdx.dylib -l:libcrypto.keys@cangjie_stdx.dylib -l:libcrypto.digest@cangjie_stdx.dylib -l:libcrypto.common@cangjie_stdx.dylib -l:libencoding.hex@cangjie_stdx.dylib -l:libencoding.base64@cangjie_stdx.dylib -l:libencoding@cangjie_stdx.dylib -l:libcompress.tar@cangjie_stdx.dylib -l:libcrypto@cangjie_stdx.dylib -l:libcompress.zlib@cangjie_stdx.dylib -l:libcompress@cangjie_stdx.dylib -l:libactors@cangjie_stdx.dylib -l:libsyntax@cangjie_stdx.dylib %%cangjie-stdx-import-path -lc++ --dy-std
  run_env = darwin_aarch64_cjnative
  host = darwin_aarch64_cjnative

[description]
  title = Cangjie2cjnative MAC AARCH64 Test
