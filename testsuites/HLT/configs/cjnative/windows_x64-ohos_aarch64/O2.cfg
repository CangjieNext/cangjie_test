[root]
	path = ../../../
[suffix]
	cj = //
	info = //
[run]
	script = python %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/run_cross-compilation.py | ignore_cmd_redirect
	pass_redirect = true
[env]
	LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
[condition]
	condition =
		cross_compilation
		Windows
		host_win
		x86
		host_x86_64
		target_ohos
		arm
		target_aarch64
		OHOS
		O2
[internal-var]
	append_macro_lib_opt = 
	append_opt = 
	append_pic_opt = 
	boundscheck = -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/linux_ohos_aarch64_cjnative/ -lboundscheck
	c_compiler = clang
	cangjie-dynamic-stdx-path = %%CANGJIE_STDX_PATH%%/../../dynamic/stdx
	cangjie-home = %%CANGJIE_HOME%%
	cangjie-repo-token = %%CANGJIE_REPO_TOKEN%%
	cangjie-static-stdx-path = %%CANGJIE_STDX_PATH%%/../../static/stdx
	cangjie-stdx-import-path = --import-path %%CANGJIE_STDX_PATH%%
	cangjie-stdx-list = -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.tar -lstdx.crypto -lstdx.compress.zlib -lstdx.compress -lstdx.actors
	cangjie-stdx-package = %%CANGJIE_STDX_PATH%%
	cangjie-stdx-path = %%CANGJIE_STDX_PATH%%/../..
	cangjieDir = %%CANGJIE_HOME%%
	cangjieStdxPath = %%CANGJIE_STDX_PATH%%
	cangjie_runtime_link = 
	cangjie_test = %%CANGJIE_TEST%%
	cat = type
	cffi_output = lib%%n.%%cffi_suffix --target=x86_64-windows-gnu
	cffi_runtime_ld = --output-type=dylib -L . -l ffi%%n
	cffi_runtime_link = -D__DSU__ -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/linux_ohos_aarch64_cjnative/ -lcangjie-runtime -lcangjie-elfloader --rtlib=compiler-rt -lstdc++ -ldl -fno-omit-frame-pointer -lsecurec
	cffi_runtime_link_no_elfloader = -D__DSU__ -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/linux_ohos_aarch64_cjnative/ -lcangjie-runtime --rtlib=compiler-rt -lstdc++ -ldl -fno-omit-frame-pointer
	cffi_runtime_opt = 
	cffi_std_link = -lstdc++
	cffi_suffix = %%dylib_suffix
	check-dylib-dep = ${OHOS_ROOT}/prebuilts/clang/ohos/windows-x86_64/llvm/bin/llvm-readelf.exe -d
	chir-dis = chir-dis
	chmod = %%chmod%%
	cjcov = %%CANGJIE_HOME%%/tools/bin/cjcov
	cjcpl = %%CANGJIE_HOME%%/tools/bin/cjcpl
	cjfmt = %%CANGJIE_HOME%%/tools/bin/cjfmt
	cjpm = cjpm
	cjpm_opt = --target=aarch64-linux-ohos
	cjtrace_recover = %%CANGJIE_HOME%%/tools/bin/cjtrace-recover
	clang = %%OHOS_ROOT%%/prebuilts/clang/ohos/windows-x86_64/llvm/bin/clang
	clang_opt = -L %%CANGJIE_HOME%%/runtime/lib/linux_ohos_aarch64_cjnative/ -shared -fPIC --target=aarch64-linux-ohos --sysroot=%%OHOS_ROOT%%/out/generic_generic_arm_64only/hisi_all_phone_standard/obj/third_party/musl -I%%OHOS_ROOT%%/out/generic_generic_arm_64only/hisi_all_phone_standard/obj/third_party/musl/usr/include/aarch64-linux-ohos
	clang_opt_objc = -fmodules -fobjc-arc -I%%CANGJIE_HOME%%/include -L%%CANGJIE_HOME%%/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
	close_apc_compile = --apc=1
	closebuf = stdbuf -o0 -e0
	cmp_macro = -O2 --error-count-limit=all --diagnostic-format=json --compile-macro
	cmp_ocffi_opt = --error-count-limit 3 -Woff all
	cmp_opt = -O2 --error-count-limit=all --diagnostic-format=json %%ohos_opt
	cmp_opt_frontend = -O2 --error-count-limit=all --diagnostic-format=json %%ohos_opt
	cmp_output = 
	cmp_stable_abi_dylib = -L. -lstable_abi
	cmp_utest_opt = --test
	compile_chir_opt = --output-type=chir --experimental
	compile_dylib_opt = --output-type=dylib
	compile_dylib_opt_cjmp = mp.chir --common-part-cjo=mp.cjo --output-type=dylib --experimental
	compile_lib_opt = --output-type=staticlib
	compile_lib_opt_cjmp = mp.chir --common-part-cjo=mp.cjo --output-type=staticlib --experimental
	compile_library = --output-type=dylib
	compiler = cjc
	compiler_frontend = cjc-frontend
	conditional_compilation_config_opt = --cfg
	cp = copy
	cp_loader_jar = -cp .:%%CANGJIE_HOME%%/lib/library-loader.jar
	cpm_bin_path = %%rtos_run ./build/aarch64-linux-ohos/bin
	diff = FC /W
	disassembler = set LD_LIBRARY_PATH=%%CANGJIE_HOME%%/third_party/llvm/lib:%%LD_LIBRARY_PATH%% && %%CANGJIE_HOME%%/third_party/llvm/bin/llvm-dis
	dump = -frontend --dump-parse
	dy_libs = --dy-libs
	dy_std = --dy-std
	dylib_suffix = dll
	enableConstPropagation = --fchir-constant-propagation
	enable_debug = 
	enable_macro = 
	enable_objc_cjmapping = --experimental --enable-interop-cjmapping=ObjC
	export = set
	export_expand = export PATH=$(pwd):$PATH
	ffic_opt = -L . -l %%n %%n.cj
	gcc = gcc
	git_dir_prefix = set GIT_DIR=
	git_dir_suffix = &&
	grep = findstr
	hle_arkts = %%CANGJIE_HOME%%/tools/bin/hle -r %%CANGJIE_HOME%%/tools/dtsparser/node_modules/typescript -j %%CANGJIE_HOME%%/tools/dtsparser/analysis.js
	hle_c = %%CANGJIE_HOME%%/tools/bin/hle -c -b %%CANGJIE_HOME%%/tools/dtsparser/node_modules/.bin/cjbind.exe
	host = windows_x86_64_cjnative
	host_cp = copy
	host_dylib_suffix = dll
	host_library_suffix = dll
	host_ls = dir
	host_triple = x86_64-w64-mingw32
	import-cangjie-stdx = import-cangjie-stdx = --import-path %%CANGJIE_LOCAL_STDX_PATH%% -L %%CANGJIE_STDX_PATH%% -lstdx.chir -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization  -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.crypto -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.zlib -lstdx.compress -lstdx.compress.tar -lstdx.actors -lstdx %%cangjie-stdx-import-path --dy-std
	import-stdx-fuzz = -L %%CANGJIE_STDX_PATH%% -lstdx.fuzz.fuzzFFI -lstdx.fuzz.fuzz  %%cangjie-stdx-import-path
	incremental_compile = --incremental-compile --experimental
	ins_nm_cjworld = --link-options="-install_name @rpath/libcjworld.dylib"
	interop_config = --experimental --import-interop-cj-package-config-path
	java = java
	java_interop_runner = %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/android/run.py
	java_interop_setup = %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/android/setup.py
	java_interop_template = %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/android/MyApplication
	java_interop_util = %%CANGJIE_TEST%%/testsuites/HLT/compiler/cjnative/FFI/jffi/android/util
	java_mirror_gen = -Dpackage.mode=true -jar %%CANGJIE_HOME%%/tools/bin/java-mirror-gen.jar -d . -cp .
	javac = javac -encoding UTF-8
	jffi_link = -L . -linteroplib.interop -lcinteroplib -ljava.lang
	ldd = ldd
	libdir = %%CANGJIE_HOME%%/modules/linux_ohos_aarch64_cjnative/
	library_suffix = dll
	link-core = -lcangjie-std-core
	link-eh = -lstdx.effect --experimental --enable-eh
	link_cjmp = -L . -lmp
	link_collection = 
	link_oc = 
	lint = %%CANGJIE_HOME%%/tools/bin/cjlint
	ls = dir
	macro_debug = --debug-macro
	macro_lib = 
	macro_lib_opt = 
	macro_opt = --output-type=dylib
	main = main
	middle = a
	mirror_gen = ObjCInteropGen --mode=normal
	mirror_opt = --generate-definitions
	mkdir = md
	mod_name = --module-name module_name
	mod_opt = --module
	mv = move
	new_cjo = --new
	no_obf_cf_bogus = --fno-obf-cf-bogus
	no_obf_cf_flatten = --fno-obf-cf-flatten
	no_obf_const = --fno-obf-const
	no_obf_export = --fno-obf-export-symbols
	no_obf_layout = --fno-obf-layout
	no_obf_line_number = --fno-obf-line-number
	no_obf_source_path = --fno-obf-source-path
	no_obf_string = --fno-obf-string
	null_path = NUL
	obf_all = --fobf-all
	obf_apply_mapping = --obf-apply-mapping-file
	obf_cf_bogus = --fobf-cf-bogus
	obf_cf_flatten = --fobf-cf-flatten
	obf_const = --fobf-const
	obf_export = --fobf-export-symbols
	obf_layout = --fobf-layout
	obf_line_number = --fobf-line-number
	obf_source_path = --fobf-source-path
	obf_string = --fobf-string
	obf_sym_input = --obf-sym-input-mapping
	obf_sym_output = --obf-sym-output-mapping
	obf_sym_prefix = --obf-sym-prefix
	object_file_suffix = obj
	ohos_opt = --target=aarch64-linux-ohos -B%%OHOS_ROOT%%/out/generic_generic_arm_64only/hisi_all_phone_standard/obj/third_party/musl/usr/lib/aarch64-linux-ohos -B%%OHOS_ROOT%%/prebuilts/clang/ohos/windows-x86_64/llvm/bin -L%%OHOS_ROOT%%/prebuilts/clang/ohos/windows-x86_64/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos -L%%OHOS_ROOT%%/prebuilts/clang/ohos/windows-x86_64/llvm/lib/aarch64-linux-ohos -L%%OHOS_ROOT%%/out/generic_generic_arm_64only/hisi_all_phone_standard/obj/third_party/musl/usr/lib/aarch64-linux-ohos -L%%OHOS_ROOT%%/out/generic_generic_arm_64only/hisi_all_phone_standard/thirdparty/openssl
	ohos_opt_pc = --target=aarch64-linux-ohos
	old_cjo = --old
	openssl_path = %%OPENSSL_PATH%%
	optimization_level = -O2
	output = %%n.%%suffix
	overflow_wrapping = --int-overflow=wrapping
	pic_opt = 
	pkg_compile = --output-type=dylib -L . -l c_ffi
	pkg_link = -L . -l c_ffi -l pkg
	pkg_opt = --package
	plugin_lsp_suffix = dll.a
	prebuilt-toolchain = ${OHOS_ROOT}/prebuilts/clang/ohos/windows-x86_64
	pwd = %%cd%%
	python = python3
	repo_sed = sed -i
	rm = del
	rmdir = rd /s /q
	run = export LD_LIBRARY_PATH=$(pwd):/data/local/tmp/linux_ohos_aarch64_cjnative:$LD_LIBRARY_PATH &&
	run_args = 
	run_args_arg = 
	run_env = linux_ohos_aarch64_cjnative
	run_macro = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% && 
	run_macro_opt = 
	run_opt = 
	run_pkg = export LD_LIBRARY_PATH=$(pwd):/data/local/tmp/linux_ohos_aarch64_cjnative:$LD_LIBRARY_PATH &&
	run_stdx = export LD_LIBRARY_PATH=$(pwd):/data/local/tmp/linux_ohos_aarch64_cjnative:$LD_LIBRARY_PATH &&
	run_utest_opt = %%utest_no_progress
	sanitizer_hwasan = --sanitize=hwaddress
	save_temps = --save-temps=.
	sed = sed
	sed_opt = -i
	serial_compile = 
	set = set
	shell = $SHELL
	source = sh
	static_libs = --static-libs
	static_std = --static-std
	stdx-library-path = -L %%CANGJIE_STDX_PATH%% %%cangjie-stdx-import-path
	stdx-package = -L %%CANGJIE_HOME%%/runtime/lib/linux_ohos_aarch64_cjnative
	suffix = exe
	target = linux_ohos_aarch64_cjnative
	target_cp = cp
	target_ls = ls
	target_triple = aarch64-linux-ohos
	test_suffix = dll
	touch = echo >
	use_ast = 
	use_pic_ast = 
	utest_no_progress = --no-progress
[description]
	title = x86_64-w64-mingw32 -> aarch64-linux-ohos, O2
