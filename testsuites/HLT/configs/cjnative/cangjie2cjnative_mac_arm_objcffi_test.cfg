[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
  inherit=./common_mac.cfg
[condition]
  condition = host_mac host_aarch64 target_mac target_aarch64 CJNATIVE arm MAC iOSNative
[internal-var]
  mirror_gen = ObjCInteropGen --mode=normal
  mirror_opt = --generate-definitions
  cmp_opt = --error-count-limit 3 -Woff all
  cmp_ocffi_opt = --error-count-limit 3 -Woff all
  link_oc = -linteroplib.objc -lobjc.lang --link-options "-framework Foundation"
  enable_objc_cjmapping = --experimental --enable-interop-cjmapping=ObjC
  interop_config = --experimental --import-interop-cj-package-config-path
  clang_opt_objc = -fno-modules -fobjc-arc -I${CANGJIE_HOME}/include -L${CANGJIE_HOME}/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
  run_env = darwin_aarch64_cjnative
  host = darwin_aarch64_cjnative

  import-cangjie-stdx = -L $CANGJIE_STDX_PATH -lchir@cangjie_stdx -lunittest.data@cangjie_stdx -lunittest@cangjie_stdx -lencoding.json@cangjie_stdx -lserialization.serialization@cangjie_stdx -lserialization@cangjie_stdx -lnet.http@cangjie_stdx -lnet.tls@cangjie_stdx -lnet.tls.common@cangjie_stdx -lnet@cangjie_stdx -llogger@cangjie_stdx -llog@cangjie_stdx -lencoding.url@cangjie_stdx -lencoding.json.stream@cangjie_stdx -lcrypto.kit@cangjie_stdx -lcrypto.x509@cangjie_stdx -lcrypto.crypto@cangjie_stdx -lcrypto.keys@cangjie_stdx -lcrypto.digest@cangjie_stdx -lcrypto.common@cangjie_stdx -lencoding.hex@cangjie_stdx -lencoding.base64@cangjie_stdx -lencoding@cangjie_stdx -lcompress.tar@cangjie_stdx -lcrypto@cangjie_stdx -lcompress.zlib@cangjie_stdx -lcompress@cangjie_stdx -lactors@cangjie_stdx -lsyntax@cangjie_stdx %%cangjie-stdx-import-path -lc++ --dy-std

[description]
  title = Cangjie2cjnative Mac arm iOS native objc ffi Test
