[root]
  path = ../../
[suffix]
  cj = //
  info = //
[env]
  LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
[inherit]
  inherit=./common.cfg

[condition]
  condition = never
[internal-var]
  # dylib suffix on host machine.
  host_dylib_suffix = so
  mkdir = mkdir -p
  rmdir = rm -rf
  cangjie-repo-token=$CANGJIE_REPO_TOKEN
  repo_sed = sed -i
  cangjie-home = $CANGJIE_HOME
  java_home = $JAVA_HOME

  import-cangjie-stdx = -L $CANGJIE_STDX_PATH -lstdx.chir -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.tar -lstdx.crypto -lstdx.compress.zlib -lstdx.compress -lstdx.actors -lstdx.syntax %%cangjie-stdx-import-path --dy-std

  cangjie-stdx-path=$CANGJIE_STDX_PATH/../..
  cangjie-static-stdx-path=$CANGJIE_STDX_PATH/../../static/stdx
  cangjie-dynamic-stdx-path=$CANGJIE_STDX_PATH/../../dynamic/stdx
  dypath-cwd = export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH &&
  dypath-cangjie-dynamic-stdx-path = export LD_LIBRARY_PATH=$CANGJIE_STDX_PATH/../../dynamic/stdx:$LD_LIBRARY_PATH &&
  check-dylib-dep = ldd 
  openssl_path = $OPENSSL_PATH

[description]
  title = Cangjie2cjnative Test
