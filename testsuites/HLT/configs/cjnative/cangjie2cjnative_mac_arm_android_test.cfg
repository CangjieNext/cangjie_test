[root]
  path = ../../
[suffix]
  cj = //
  info = //
[inherit]
  inherit=./common_mac.cfg
[run]
  script = python3 ${CANGJIE_TEST}/testsuites/HLT/configs/cjnative/run_cross-compilation.py --tool=adb | ignore_cmd_redirect
  pass_redirect = true
[condition]
  condition = host_mac host_aarch64 target_android target_aarch64 CJNATIVE arm MAC Android
[internal-var]
  # run
  compiler = export DYLD_LIBRARY_PATH=$(pwd):$CANGJIE_DYLD_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/runtime/lib/linux_android_aarch64_cjnative:$CANGJIE_HOME/tools/lib && cjc
  run_env = linux_android_aarch64_cjnative
  run = export LD_LIBRARY_PATH=$(pwd):/data/local/tmp/linux_android_aarch64_cjnative:$LD_LIBRARY_PATH &&
  run_pkg = export LD_LIBRARY_PATH=$(pwd):/data/local/tmp/linux_android_aarch64_cjnative:$LD_LIBRARY_PATH &&
  run_macro = export DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative:$CANGJIE_HOME/runtime/lib/linux_android_aarch64_cjnative:$CANGJIE_HOME/tools/lib &&

  # API
  stdx-package = -L $CANGJIE_HOME/lib/linux_android_aarch64_cjnative/
  cangjie-stdx-package = $CANGJIE_STDX_PATH
  import-cangjie-stdx = --import-path $CANGJIE_LOCAL_STDX_PATH -L $CANGJIE_STDX_PATH -l:libchir@cangjie_stdx.dylib -l:libunittest.data@cangjie_stdx.dylib -l:libunittest@cangjie_stdx.dylib -l:libencoding.json@cangjie_stdx.dylib -l:libserialization.serialization@cangjie_stdx.dylib -l:libserialization@cangjie_stdx.dylib  -l:libnet.http@cangjie_stdx.dylib -l:libnet.tls@cangjie_stdx.dylib -l:libnet.tls.common@cangjie_stdx.dylib -l:libnet@cangjie_stdx.dylib -l:liblogger@cangjie_stdx.dylib -l:liblog@cangjie_stdx.dylib -l:libencoding.url@cangjie_stdx.dylib -l:libencoding.json.stream@cangjie_stdx.dylib -l:libcrypto.kit@cangjie_stdx.dylib -l:libcrypto.x509@cangjie_stdx.dylib -l:libcrypto.crypto@cangjie_stdx.dylib -l:libcrypto.keys@cangjie_stdx.dylib -l:libcrypto.digest@cangjie_stdx.dylib -l:libcrypto.common@cangjie_stdx.dylib -l:libcrypto@cangjie_stdx.dylib -l:libencoding.hex@cangjie_stdx.dylib -l:libencoding.base64@cangjie_stdx.dylib -l:libencoding@cangjie_stdx.dylib -l:libcompress.zlib@cangjie_stdx.dylib -l:libcompress@cangjie_stdx.dylib -l:libcompress.tar@cangjie_stdx.dylib -l:libactors@cangjie_stdx.dylib -l:libsyntax@cangjie_stdx.dylib -lsyntaxFFI -L $CANGJIE_HOME/runtime/lib/linux_android_aarch64_cjnative -lcangjie-std-ast %%cangjie-stdx-import-path
  set_stdx_path = export PATH= $CANGJIE_STDX_PATH:$PATH &&
  import-stdx-fuzz = -L $CANGJIE_STDX_PATH -lfuzz.fuzzFFI -l:libfuzz.fuzz@cangjie_stdx.dylib  %%cangjie-stdx-import-path

  cangjie-stdx-import-path = --import-path $CANGJIE_STDX_PATH

  run_stdx = export LD_LIBRARY_PATH=/data/local/tmp/linux_android_aarch64_cjnative:$LD_LIBRARY_PATH &&

  # ohos
  ohos_opt = --target=aarch64-linux-android -B=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/sysroot --static
  ohos_opt_pc = --target=aarch64-linux-android

  # clang
  clang = ${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/bin/clang
  clang_opt = -shared -fPIC --target=aarch64-linux-android31 --sysroot=${OHOS_ROOT}/llvm/prebuilt/darwin-arm64/sysroot

  # java
  java = java
  javac = javac -encoding UTF-8
  java_mirror_gen = -Dpackage.mode=true -jar $CANGJIE_HOME/tools/bin/java-mirror-gen.jar -d . -cp .
  java_interop_template = ${JAVA_INTEROP_TEMPLATE}
  java_interop_util = ${JAVA_INTEROP_UTIL}
  java_interop_runner = ${JAVA_INTEROP_SCRIPTS}/run.py
  java_interop_setup = ${JAVA_INTEROP_SCRIPTS}/setup.py

  host = darwin_aarch64_cjnative

  # imported from original

  # cjc
  cmp_opt = --error-count-limit=all --diagnostic-format=json %%ohos_opt
  cmp_opt_frontend = --error-count-limit=all --diagnostic-format=json %%ohos_opt
  serial_compile = -j 1

  # run
  dylib_suffix = so

  # std/libs/unittest
  cmp_utest_opt = --test
  run_utest_opt = %%utest_no_progress
  utest_no_progress = --no-progress

  ## imported from original cangjie2cjnative_mac_arm_test.cfg
  cmp_ocffi_opt = --error-count-limit 3 -Woff all
  link_oc = -linteroplib.objc
  clang_opt_objc = -fmodules -fobjc-arc -I${CANGJIE_HOME}/include -L${CANGJIE_HOME}/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime


[description]
  title = Cangjie2cjnative Mac aarch64 Android Test
