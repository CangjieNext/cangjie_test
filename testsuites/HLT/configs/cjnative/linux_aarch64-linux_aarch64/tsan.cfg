[root]
	path = ../../../
[suffix]
	cj = //
	info = //
[env]
	LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
[condition]
	condition =
		native_compilation
		host_linux
		arm
		host_aarch64
		target_linux
		arm
		target_aarch64
[internal-var]
	append_macro_lib_opt = 
	append_opt = 
	append_pic_opt = 
	boundscheck = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/linux_aarch64_cjnative/tsan -lboundscheck
	c_compiler = clang
	cangjie-dynamic-stdx-path = $CANGJIE_STDX_PATH/../../dynamic/stdx
	cangjie-home = $CANGJIE_HOME
