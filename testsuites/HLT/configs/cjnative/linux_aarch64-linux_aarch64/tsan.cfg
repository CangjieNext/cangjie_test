	cffi_runtime_link_no_elfloader = -D__DSU__ -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/linux_aarch64_cjnative/tsan/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer
	cffi_runtime_opt = 
	cffi_std_link = -lstdc++
	cffi_suffix = %%dylib_suffix
	check-dylib-dep = ldd
	chir-dis = chir-dis
	chmod = chmod
	cjcov = $CANGJIE_HOME/tools/bin/cjcov
	cjcpl = $CANGJIE_HOME/tools/bin/cjcpl
	cjfmt = $CANGJIE_HOME/tools/bin/cjfmt
	cjpm = cjpm
	cjpm_opt = --target=aarch64-linux-gnu
	cjtrace_recover = $CANGJIE_HOME/tools/bin/cjtrace-recover
	clang = clang
	clang_opt = -shared -fPIC
	clang_opt_objc = -fmodules -fobjc-arc -I$CANGJIE_HOME/include -L$CANGJIE_HOME/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
	close_apc_compile = --apc=1
	closebuf = stdbuf -o0 -e0
	cmp_macro = --error-count-limit=all --diagnostic-format=json --compile-macro
	cmp_ocffi_opt = --error-count-limit 3 -Woff all
	cmp_opt = --sanitize=thread --sanitize-set-rpath --error-count-limit=all --diagnostic-format=json
	cmp_opt_frontend = --error-count-limit=all --diagnostic-format=json
	cmp_output = 
	cmp_stable_abi_dylib = -L. -lstable_abi
	cmp_utest_opt = --test
	compile_chir_opt = --output-type=chir --experimental
	compile_dylib_opt = --output-type=dylib
	compile_dylib_opt_cjmp = mp.chir --common-part-cjo=mp.cjo --output-type=dylib --experimental
	compile_lib_opt = --output-type=staticlib
	compile_lib_opt_cjmp = mp.chir --common-part-cjo=mp.cjo --output-type=staticlib --experimental
	compile_library = --output-type=dylib
	compiler = cjc
	compiler_frontend = cjc-frontend
	conditional_compilation_config_opt = --cfg
	cp = cp
	cp_loader_jar = -cp .:$CANGJIE_HOME/lib/library-loader.jar
	cpm_bin_path = ./build/bin
	diff = diff
	disassembler = LD_LIBRARY_PATH=$CANGJIE_HOME/third_party/llvm/lib:$LD_LIBRARY_PATH $CANGJIE_HOME/third_party/llvm/bin/llvm-dis
	dump = -frontend --dump-parse
	dy_libs = --dy-libs
	dy_std = --dy-std
	dylib_suffix = so
	enableConstPropagation = --fchir-constant-propagation
	enable_debug = 
	enable_macro = 
	enable_objc_cjmapping = --experimental --enable-interop-cjmapping=ObjC
	export = export
	export_expand = export PATH=$(pwd):$PATH
	ffic_opt = -L . -l %%n %%n.cj
	gcc = gcc
	git_dir_prefix = GIT_DIR=
	git_dir_suffix = 
	grep = grep
	hle_arkts = $CANGJIE_HOME/tools/bin/hle -r $CANGJIE_HOME/tools/dtsparser/node_modules/typescript -j $CANGJIE_HOME/tools/dtsparser/analysis.js
	hle_c = $CANGJIE_HOME/tools/bin/hle -c -b $CANGJIE_HOME/tools/dtsparser/node_modules/.bin/cjbind
	host = linux_aarch64_cjnative
	host_cp = cp
	host_dylib_suffix = so
	host_library_suffix = so
	host_ls = ls
	host_triple = aarch64-linux-gnu
	import-cangjie-stdx = -L $CANGJIE_STDX_PATH -lstdx.chir -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.tar -lstdx.crypto -lstdx.compress.zlib -lstdx.compress -lstdx.actors -lstdx.syntax %%cangjie-stdx-import-path --dy-std
	import-stdx-fuzz = -L $CANGJIE_STDX_PATH -lstdx.fuzz.fuzzFFI -lstdx.fuzz.fuzz  %%cangjie-stdx-import-path
	incremental_compile = --incremental-compile --experimental
	ins_nm_cjworld = --link-options="-install_name @rpath/libcjworld.dylib"
	interop_config = --experimental --import-interop-cj-package-config-path
