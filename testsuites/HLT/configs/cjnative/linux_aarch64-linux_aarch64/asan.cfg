[root]
  path = ../../../
[suffix]
  cj = //
  info = //
[inherit]
  inherit=./basic.cfg
[condition]
  condition = host_linux host_aarch64 target_linux target_aarch64 CJNATIVE arm
[internal-var]
  # cjc
  cmp_opt = --sanitize=address --sanitize-set-rpath --error-count-limit=all --diagnostic-format=json
  cmp_macro = --error-count-limit=all --diagnostic-format=json --compile-macro
  cmp_opt_frontend = --error-count-limit=all --diagnostic-format=json

  stdx-package = -L $CANGJIE_HOME/runtime/lib/%%run_env/asan/
  cffi_runtime_link = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/%%run_env/asan/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer -lboundscheck
  cffi_runtime_link_no_elfloader = -D__DSU__ -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/%%run_env/asan/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer
  boundscheck = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/%%run_env/asan/ -lboundscheck

[description]
  title = Cangjie2cjnative asan Test
