[root]
  path = ../../../
[suffix]
  cj = //
  info = //
[inherit]
  inherit=./basic.cfg
[condition]
  condition = host_linux host_aarch64 target_linux target_aarch64 CJNATIVE arm O2
[internal-var]
  # cjc
  cmp_opt = -O2 --sanitize=thread --sanitize-set-rpath --error-count-limit=all --diagnostic-format=json
  cmp_macro = -O2 --error-count-limit=all --diagnostic-format=json --compile-macro
  cmp_opt_frontend = -O2 --error-count-limit=all --diagnostic-format=json

  stdx-package = -L $CANGJIE_HOME/runtime/lib/%%run_env/tsan/
  cffi_runtime_link = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/%%run_env/tsan/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer -lboundscheck
  cffi_runtime_link_no_elfloader = -D__DSU__ -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/%%run_env/tsan/ -lcangjie-runtime --rtlib=compiler-rt %%cffi_std_link -ldl -fno-omit-frame-pointer
  boundscheck = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/%%run_env/tsan/ -lboundscheck

[description]
  title = Cangjie2cjnative O2 tsan Test
